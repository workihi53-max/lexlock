[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexlock"
version = "0.2.2"
description = "Локальный офлайн-ассистент для юристов (Legal AI Vault)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ocr = [
    "pymupdf>=1.24",
]

[tool.setuptools.packages.find]
include = ["lexlock*", "app*"]

[tool.setuptools.package-data]
app = ["static/*"]
