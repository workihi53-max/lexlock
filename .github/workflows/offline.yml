name: Offline bundles

# Пуш тега vX.Y.Z -> сборка офлайн-пакетов под все ОС и публикация в GitHub Releases.
# Руками: Actions -> Offline bundles -> Run workflow (опубликует только артефакты).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      model:
        description: "Модель Ollama"
        default: "qwen2.5:3b"

permissions:
  contents: write

env:
  MODEL: ${{ inputs.model || 'qwen2.5:3b' }}
  # Лимит GitHub на один файл релиза — 2 ГиБ.
  LIMIT_BYTES: 2147000000

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux }
          - { os: ubuntu-latest,  target: windows }
          - { os: macos-latest,   target: macos }
          - { os: macos-15-intel, target: macos, optional: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Версия тега должна совпадать с pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Тег $GITHUB_REF_NAME, а версия в pyproject.toml $V"; exit 1; }
      - name: Установить uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Установить zstd/unzip (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd unzip
      - name: Кэш модели Ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-model-${{ env.MODEL }}
      - name: Кэш загрузок сборки
        uses: actions/cache@v4
        with:
          path: dist/.cache
          key: bundle-cache-${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('scripts/build_offline.sh') }}
      - name: Собрать пакет
        run: bash scripts/build_offline.sh ${{ matrix.target }} "$MODEL"
      - name: Уложиться в лимит 2 ГиБ (иначе облегчённая модель)
        if: matrix.target == 'macos'
        run: |
          set -x
          F="$(ls dist/*-offline.dmg | head -1)"
          if [ "$(wc -c < "$F")" -gt "$LIMIT_BYTES" ]; then
            echo "dmg больше 2 ГиБ - пересобираю с qwen2.5:1.5b"
            bash scripts/build_offline.sh macos qwen2.5:1.5b
          fi
      - name: Проверить размер
        run: |
          for f in dist/*-offline.zip dist/*-offline.AppImage dist/*-offline.dmg; do
            [ -f "$f" ] || continue
            S="$(wc -c < "$f")"; echo "$f: $S"
            [ "$S" -le "$LIMIT_BYTES" ] || { echo "Файл больше лимита GitHub (2 ГиБ)"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}-${{ matrix.os }}
          path: |
            dist/*-offline.zip
            dist/*-offline.AppImage
            dist/*-offline.dmg
          compression-level: 0

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: bundle-*
          merge-multiple: true
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh assets
          [ -n "$(ls assets)" ] || { echo "Нет файлов для релиза"; exit 1; }
          cat > notes.md <<'TXT'
          ## Как скачать и открыть (интернет при установке не нужен)

          - **Windows:** `*-win-offline.zip` — распаковать целиком, запустить «Запустить ЛексЛок.bat».
          - **macOS:** `*-mac-arm64-offline.dmg` (Apple M1/M2/M3/M4) или `*-mac-x86_64-offline.dmg` (Intel) —
            перетащить в «Программы», первый раз открыть правым кликом → «Открыть».
          - **Linux:** `*-linux-offline.AppImage` — `chmod +x` и запустить
            (если не стартует без FUSE: `--appimage-extract-and-run`).

          Внутри Python, Ollama и модель. Файлы не подписаны — система может предупредить при первом запуске.
          TXT
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" assets/* --clobber \
            || gh release create "$GITHUB_REF_NAME" assets/* --title "ЛексЛок ${GITHUB_REF_NAME#v}" --notes-file notes.md
